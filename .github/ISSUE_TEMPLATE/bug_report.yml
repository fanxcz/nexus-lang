name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: NEXUS Version
      description: What version of NEXUS are you using? (run `nexus --version`)
      placeholder: "2.1.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you running on?
      placeholder: "e.g., Ubuntu 24.04, Windows 11, macOS 14"
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler Toolchain
      description: What compiler/toolchain are you using?
      placeholder: "e.g., clang 18, MSVC 19.40, GCC 13"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Create a new project: `nexus new test --template app`
        2. Add this code to `src/main.nx`:
        3. Run `nexus build`
        4. Observe the error
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe expected behavior...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages, stack traces, etc.
      placeholder: Describe actual behavior...
      render: text
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal Code Sample
      description: If applicable, provide a minimal code sample that reproduces the issue.
      placeholder: |
        ```nx
        import std.io
        fn main() {
            // Your code here
        }
        ```
      render: nx
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Build Logs / Error Output
      description: Paste relevant build logs, compiler output, or runtime errors.
      placeholder: Paste logs here...
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have tested with the latest version
          required: true
        - label: I have provided a minimal reproduction case
          required: false