name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please fill out the form below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is your feature request related to a problem?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
      placeholder: Describe the feature...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: Alternative approaches...
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of NEXUS would this feature affect?
      options:
        - Compiler (lexer, parser, semantic, codegen)
        - Runtime (memory, graphics, audio, input, etc.)
        - Standard Library (std.io, std.fs, std.net, etc.)
        - Tooling (fmt, lint, doc, bench, lsp, editor)
        - Package Manager (pkg init/add/remove/list/update/build/publish)
        - Build System (CMake, project templates)
        - Documentation / Website
        - Examples / Templates
        - CI / Infrastructure
        - Other
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would improve workflow
        - High - Blocking a use case
        - Critical - Required for production
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use Cases
      description: Describe specific use cases for this feature.
      placeholder: |
        - Use case 1: ...
        - Use case 2: ...
      render: markdown
    validations:
      required: false
  - type: textarea
    id: api
    attributes:
    attributes:
      label: API Design (if applicable)
      description: If this involves a new API, sketch out what it might look like.
      placeholder: |
        ```nx
        // Example API design
        import std.newmodule
        fn main() {
            newmodule.do_something()
        }
        ```
      render: nx
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues/PRs for similar requests
          required: true
        - label: This feature aligns with NEXUS's goals (native, cross-platform, game/app runtime)
          required: true