site_name: NEXUS Programming Language
site_description: NEXUS is an open-source native programming language and runtime for applications, creative tools, and games.
site_author: fanxcz
site_url: https://fanxcz.github.io/nexus-lang/
repo_url: https://github.com/fanxcz/nexus-lang
repo_name: fanxcz/nexus-lang

docs_dir: ../../../docs
site_dir: ../../../site
edit_uri: edit/main/docs/

# MkDocs excludes the top-level docs/templates directory by default.
# Re-include it because the template guides are linked in the navigation.
exclude_docs: |
  !/templates/
  /assets/screenshots/README.md

copyright: Copyright &copy; 2026 fanxcz

theme:
  name: material
  language: en
  logo: assets/images/nexus-mark.svg
  favicon: assets/images/nexus-mark.svg
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
  - git-authors
  - minify:
      minify_html: true

extra_css:
  - assets/stylesheets/nexus.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      baselevel: 2

nav:
  - Home: index.md
  - Downloads: downloads.md
  - Screenshots: screenshots.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Project Structure: getting-started/project-structure.md
  - Language Reference:
