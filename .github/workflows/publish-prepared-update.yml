name: Verify and publish prepared NEXUS update

on:
  push:
    branches:
      - agent/publish-prepared-update-20261031
    paths:
      - nexus-update.part00

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve patch and install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          cat nexus-update.part00 nexus-update.part01 nexus-update.part02 nexus-update.part03 nexus-update.part04 nexus-update.part05 nexus-update.part06 nexus-update.part07 nexus-update.part08 nexus-update.part09 nexus-update.part10 nexus-update.part11 nexus-update.part12 nexus-update.part13 nexus-update.part14 nexus-update.part15 nexus-update.part16 nexus-update.part17 > "$RUNNER_TEMP/nexus-update.b64"
          base64 --decode "$RUNNER_TEMP/nexus-update.b64" | bzip2 -dc > "$RUNNER_TEMP/nexus-update.patch"
          sudo apt-get update
          sudo apt-get install -y clang llvm lld libsdl2-dev libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2 libgdk-pixbuf-2.0-0

      - name: Set up Python for documentation build
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply, build, test, document, and publish to main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "fanxcz"
          git config user.email "sad098184@gmail.com"
          git fetch origin main
          git checkout --detach origin/main
          git apply --check "$RUNNER_TEMP/nexus-update.patch"
          git apply "$RUNNER_TEMP/nexus-update.patch"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_BUILD_TESTS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --parallel 2
          python -m pip install --upgrade pip
          python -m pip install -r .github/project-tools/repository-files/requirements-docs.txt
          mkdocs build --strict -f .github/project-tools/repository-files/mkdocs.yml
          if grep -Eq ':material-[[:alnum:]-]+:' site/index.html; then
            echo "ERROR: Material icon shortcodes were emitted literally on the homepage." >&2
            exit 1
          fi
          python3 scripts/build_manual_pdf.py docs/manual.md site/pdf/NEXUS-Documentation.pdf
          test -s site/pdf/NEXUS-Documentation.pdf
          git diff --check
          git add -A
          git commit -m "feat: add fixed-width types and checked slices"
          git push origin HEAD:refs/heads/main
          curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/fanxcz/nexus-lang/actions/workflows/pages.yml/dispatches \
            --data '{"ref":"main"}'
