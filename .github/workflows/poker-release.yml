name: Package NEXUS Poker for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['poker-v*']
    paths:
      - 'examples/poker_gui.nx'
      - 'examples/assets/**'
      - 'examples/run_poker.bat'
      - 'examples/POKER_README.md'
      - 'examples/POKER_THIRD_PARTY_NOTICES.md'
      - '.github/workflows/poker-release.yml'

permissions:
  contents: write

concurrency:
  group: nexus-poker-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-windows:
    name: Build distributable Windows ZIP
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve the published installer version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -LiteralPath 'CMakeLists.txt' `
            -Pattern 'project\(nexus VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
          if (-not $match) { throw 'Could not read the NEXUS version from CMakeLists.txt.' }
          $version = $match.Matches[0].Groups[1].Value
          "NEXUS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Installer version: $version"

      - name: Download the official NEXUS installer and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP "NEXUS-Setup-$env:NEXUS_VERSION.exe"
          # The download helper retries while the Pages deployment propagates and
          # refuses HTML 404 pages or payloads that do not match the published
          # checksum, so this step fails with a precise reason instead of later.
          python scripts/fetch_installer.py --version $env:NEXUS_VERSION --output $installer
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not obtain a verified official NEXUS Setup installer.'
          }
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Verified official NEXUS Setup SHA-256: $actual"

      - name: Install NEXUS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP "NEXUS-Setup-$env:NEXUS_VERSION.exe"
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/TASKS=addtopath') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NEXUS Setup failed with exit code $($process.ExitCode)." }
          $nexus = Join-Path $env:LOCALAPPDATA 'Programs\NEXUS\nexus.cmd'
          if (-not (Test-Path -LiteralPath $nexus)) { throw 'Installed nexus.cmd was not found.' }
          $version = & $nexus --version 2>&1
          $expected = 'Nexus ' + [regex]::Escape($env:NEXUS_VERSION)
          if ($LASTEXITCODE -ne 0 -or (($version -join "`n") -notmatch $expected)) {
            throw "Unexpected installed compiler version: $($version -join "`n")"
          }
          Write-Host ($version -join "`n")

      - name: Compile and assemble NEXUS Poker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_WORKSPACE
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\NEXUS'
          $nexus = Join-Path $installRoot 'nexus.cmd'
          $stage = Join-Path $env:RUNNER_TEMP 'NEXUS-Poker-Windows-x64'
          $exe = Join-Path $stage 'NEXUS-Poker.exe'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          # The supported Windows wrapper builds beside the source. Package
          # that verified output into the isolated release staging directory.
          $source = Join-Path $repo 'examples\poker_gui.nx'
          $sourceExe = Join-Path $repo 'examples\poker_gui.exe'
          if (Test-Path -LiteralPath $sourceExe) { Remove-Item -LiteralPath $sourceExe -Force }
          & $nexus build $source
          if ($LASTEXITCODE -ne 0) { throw 'NEXUS Poker compilation failed.' }
          if (-not (Test-Path -LiteralPath $sourceExe)) { throw 'The compiler did not create examples/poker_gui.exe.' }
          Copy-Item -LiteralPath $sourceExe -Destination $exe -Force
          $assets = Join-Path $stage 'assets'
          foreach ($directory in @('cards','table','ui','sounds')) {
            $from = Join-Path (Join-Path $repo 'examples\assets') $directory
            $to = Join-Path $assets $directory
            New-Item -ItemType Directory -Path $to -Force | Out-Null
            if ($directory -eq 'cards') {
              Get-ChildItem -LiteralPath $from -Filter 'card_*.png' -File | Copy-Item -Destination $to -Force
              Copy-Item -LiteralPath (Join-Path $from 'card_back.png') -Destination $to -Force
            } elseif ($directory -eq 'table') {
              Copy-Item -LiteralPath (Join-Path $from 'felt.png') -Destination $to -Force
            } elseif ($directory -eq 'ui') {
              Copy-Item -LiteralPath (Join-Path $from 'cursor.png') -Destination $to -Force
            } else {
              foreach ($sound in @('deal.wav','chip.wav','fold.wav','lose.wav','win.wav')) {
                Copy-Item -LiteralPath (Join-Path $from $sound) -Destination $to -Force
              }
            }
          }

          # Copy runtime DLLs from the verified NEXUS distribution. Some builds
          # already copy these beside the EXE; only fill missing files here.
          foreach ($dll in @('SDL2.dll','SDL2_image.dll','SDL2_ttf.dll','SDL2_mixer.dll','sqlite3.dll')) {
            $target = Join-Path $stage $dll
            if (-not (Test-Path -LiteralPath $target)) {
              $found = Get-ChildItem -LiteralPath $installRoot -Filter $dll -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $found) { throw "Required runtime DLL not found: $dll" }
              Copy-Item -LiteralPath $found.FullName -Destination $target -Force
            }
          }

          # SDL2_image.dll is built against the Microsoft Visual C++ runtime.
          # GitHub runners have it installed system-wide, which can mask a
          # missing-DLL failure in a portable ZIP. Ship an app-local CRT copy.
          $crtNames = @('VCRUNTIME140.dll','VCRUNTIME140_1.dll','MSVCP140.dll','MSVCP140_1.dll','MSVCP140_2.dll','concrt140.dll')
          $vsRoots = @(
            (Join-Path $env:ProgramFiles 'Microsoft Visual Studio'),
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          foreach ($name in $crtNames) {
            $target = Join-Path $stage $name
            if (Test-Path -LiteralPath $target) { continue }
            $systemCandidate = Join-Path (Join-Path $env:WINDIR 'System32') $name
            if (Test-Path -LiteralPath $systemCandidate) {
              Copy-Item -LiteralPath $systemCandidate -Destination $target -Force
              continue
            }
            $found = $null
            foreach ($root in $vsRoots) {
              $found = Get-ChildItem -LiteralPath $root -Filter $name -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { break }
            }
            if ($found) {
              Copy-Item -LiteralPath $found.FullName -Destination $target -Force
            } elseif ($name -eq 'VCRUNTIME140.dll') {
              throw 'VCRUNTIME140.dll is required by SDL2_image.dll but was not found. Cannot create a portable package.'
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'VCRUNTIME140.dll'))) {
            throw 'Portable package is missing VCRUNTIME140.dll.'
          }

          # Always provide a launcher that fixes the working directory and
          # keeps runtime diagnostics visible if startup fails on a user's PC.
          $launcher = Join-Path $stage 'Play NEXUS Poker.bat'
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "PATH=%~dp0;%PATH%"
          echo Starting NEXUS Poker...
          echo If the game closes or fails, copy the error shown below.
          echo.
          if not exist "%~dp0NEXUS-Poker.exe" (
            echo [ERROR] NEXUS-Poker.exe is missing from this folder.
            pause
            exit /b 1
          )
          "%~dp0NEXUS-Poker.exe"
          set "GAME_EXIT_CODE=%ERRORLEVEL%"
          echo.
          if not "%GAME_EXIT_CODE%"=="0" echo NEXUS Poker exited with code %GAME_EXIT_CODE%.
          pause
          exit /b %GAME_EXIT_CODE%
          '@ | Set-Content -LiteralPath $launcher -Encoding ASCII

          Copy-Item -LiteralPath (Join-Path $repo 'LICENSE') -Destination (Join-Path $stage 'LICENSE.txt') -Force
          Copy-Item -LiteralPath (Join-Path $repo 'examples\POKER_README.md') -Destination (Join-Path $stage 'README.md') -Force
          Copy-Item -LiteralPath (Join-Path $repo 'examples\POKER_THIRD_PARTY_NOTICES.md') -Destination (Join-Path $stage 'THIRD_PARTY_NOTICES.md') -Force
          if (-not (Test-Path -LiteralPath (Join-Path $assets 'cards\card_51.png'))) { throw 'Card textures were not packaged.' }
          if (-not (Test-Path -LiteralPath (Join-Path $assets 'table\felt.png'))) { throw 'Table texture was not packaged.' }
          Write-Host "Packaged executable and runtime assets in $stage"

      - name: Smoke-test game startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'NEXUS-Poker-Windows-x64'
          $exe = Join-Path $stage 'NEXUS-Poker.exe'
          foreach ($required in @('VCRUNTIME140.dll','SDL2.dll','SDL2_image.dll','SDL2_ttf.dll','SDL2_mixer.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage $required))) {
              throw "Portable launch dependency is missing: $required"
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'Play NEXUS Poker.bat'))) {
            throw 'The user-facing Play NEXUS Poker.bat launcher is missing.'
          }
          $process = Start-Process -FilePath $exe -WorkingDirectory $stage -PassThru
          Start-Sleep -Seconds 4
          $process.Refresh()
          if ($process.HasExited) {
            throw "NEXUS Poker exited during startup (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host 'PASS NEXUS Poker started with the packaged runtime and assets.'

      - name: Create distributable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'NEXUS-Poker-Windows-x64'
          $zip = Join-Path $env:RUNNER_TEMP 'NEXUS-Poker-Windows-x64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal -Force
          if ((Get-Item -LiteralPath $zip).Length -lt 4096) { throw 'The Poker ZIP is unexpectedly small.' }
          Write-Host "Created $zip"

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Poker-Windows-x64
          path: ${{ runner.temp }}/NEXUS-Poker-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for poker tags
        if: startsWith(github.ref, 'refs/tags/poker-v')
        uses: softprops/action-gh-release@v2
        with:
          name: NEXUS Poker ${{ github.ref_name }}
          body_path: examples/POKER_README.md
          files: ${{ runner.temp }}/NEXUS-Poker-Windows-x64.zip
          fail_on_unmatched_files: true

# App-local VC runtime and the diagnostic launcher are part of the portable ZIP.
