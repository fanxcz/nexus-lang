name: Repository link checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Validate links throughout the repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate relative links and same-repository URLs
        run: python scripts/check_repository_links.py

      - name: Check external URLs in project documents and source
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --include-fragments
            --timeout 45
            --max-retries 4
            --max-concurrency 3
            --exclude '^file:///.*docs/assets/downloads/'
            --exclude '^https://github\.com/fanxcz/nexus-lang/(blob|tree)/main/'
            --exclude '^https://raw\.githubusercontent\.com/fanxcz/nexus-lang/main/'
            --exclude '^https://github\.com/fanxcz/nexus-lang/issues/new/choose$'
            README.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            docs
            examples
            stdlib
            src
            tests
            .github
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Published Pages routes and generated download assets are verified after deployment
      # by pages.yml, avoiding a race with the previous live site during simultaneous pushes.
