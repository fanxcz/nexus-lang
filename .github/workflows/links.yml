name: Repository link checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Validate links throughout the repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate relative links and same-repository URLs
        run: python scripts/check_repository_links.py

      - name: Check external URLs in project documents and source
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --include-fragments
            --timeout 30
            --max-retries 2
            --max-concurrency 8
            --exclude '^file:///.*docs/assets/downloads/'
            README.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            docs
            examples
            stdlib
            src
            tests
            .github
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Verify live Pages routes and downloadable assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://fanxcz.github.io/nexus-lang'
          routes=(
            '/'
            '/downloads/'
            '/getting-started/quickstart/'
            '/language/overview/'
            '/runtime/overview/'
            '/std/overview/'
            '/tooling/commands/'
          )
          for route in "${routes[@]}"; do
            echo "Checking page: $base$route"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --retry-all-errors --max-time 45 --output /dev/null "$base$route"
          done

          assets=(
            'NEXUS-Setup-1.1.0.exe'
            'NEXUS-Setup-1.1.0.exe.sha256.txt'
            'NEXUS_Windows_Portable.zip'
            'NEXUS_Windows_Portable.zip.sha256.txt'
            'NEXUS-Language-1.1.0.vsix'
            'NEXUS-Language-1.1.0.vsix.sha256.txt'
            'NEXUS-Paint-Windows-x64.exe'
            'NEXUS-Paint-Windows-x64.exe.sha256.txt'
            'NEXUS-Paint-Windows-x64.zip'
            'NEXUS-Paint-Windows-x64.zip.sha256.txt'
          )
          for asset in "${assets[@]}"; do
            url="$base/assets/downloads/$asset"
            echo "Checking download: $url"
            curl --fail --silent --show-error --head --location --retry 3 --retry-delay 2 --retry-all-errors --max-time 45 --output /dev/null "$url"
          done
          echo 'PASS: published documentation routes and packaged download URLs respond successfully.'
