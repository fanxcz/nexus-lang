name: Publish NEXUS static HTML site and Windows package

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'scripts/build_website.py'
      - 'scripts/build_manual_pdf.py'
      - 'Install-NEXUS.bat'
      - 'Install-NEXUS.ps1'
      - 'README.md'
      - '.github/workflows/pages.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'src/**'
      - 'stdlib/**'
      - 'examples/**'
      - 'tests/**'
      - '.github/project-tools/repository-files/**'
      - '.github/project-tools/installer/**'
      - '.github/project-tools/vscode-extension/**'
      - 'scripts/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  package-windows:
    name: Build and package Windows compiler
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read project versions
        shell: pwsh
        run: python scripts/nexus_version.py github-env >> $env:GITHUB_ENV

      - name: Install Windows build tools
        shell: pwsh
        run: choco install ninja llvm innosetup -y --no-progress

      - name: Configure
        run: cmake -S . -B build -G Ninja -DNEXUS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Assemble portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'NEXUS_Windows_Portable'
          New-Item -ItemType Directory -Path $package -Force | Out-Null

          if (-not (Test-Path 'build/nexus.exe')) { throw 'build/nexus.exe was not produced.' }
          $bin = Join-Path $package 'bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Copy-Item 'build/nexus.exe' (Join-Path $bin 'nexus-core.exe') -Force

          # Bundle a pinned Zig/Clang-compatible C++ toolchain. Zig ships its
          # own compiler, linker, libc headers and Windows target support, so
          # generated programs do not need a separately installed LLVM/MSVC SDK.
          $zigVersion = '0.14.1'
          $zigZip = Join-Path $env:RUNNER_TEMP "zig-windows-x64-$zigVersion.zip"
          $zigExtract = Join-Path $env:RUNNER_TEMP "zig-windows-x64-$zigVersion"
          Invoke-WebRequest "https://ziglang.org/download/$zigVersion/zig-x86_64-windows-$zigVersion.zip" -OutFile $zigZip
          Expand-Archive -LiteralPath $zigZip -DestinationPath $zigExtract -Force
          $zigRoot = Get-ChildItem -LiteralPath $zigExtract -Directory | Select-Object -First 1
          if (-not $zigRoot) { throw 'The official Zig archive did not contain its toolchain directory.' }
          $toolchain = Join-Path $package 'toolchain'
          New-Item -ItemType Directory -Path $toolchain -Force | Out-Null
          foreach ($required in @('zig.exe','lib')) {
            $source = Join-Path $zigRoot.FullName $required
            if (-not (Test-Path -LiteralPath $source)) { throw "Bundled Zig component is missing: $required" }
            Copy-Item -LiteralPath $source -Destination $toolchain -Recurse -Force
          }
          foreach ($license in @('LICENSE','README.md')) {
            $source = Join-Path $zigRoot.FullName $license
            if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination $toolchain -Force }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $toolchain 'zig.exe'))) { throw 'Bundled zig.exe was not packaged.' }
          $zigWrapper = Join-Path $bin 'clang++.cmd'
          @'
          @echo off
          setlocal
          "%~dp0..\toolchain\zig.exe" c++ %*
          exit /b %ERRORLEVEL%
          '@ | Set-Content -LiteralPath $zigWrapper -Encoding ASCII

          $directories = @(
            @{ Source = 'src/runtime'; Destination = 'runtime' },
            @{ Source = 'stdlib'; Destination = 'stdlib' },
            @{ Source = 'examples/templates'; Destination = 'project-templates' }
          )
          foreach ($directory in $directories) {
            if (-not (Test-Path $directory.Source)) { throw "Required package directory missing: $($directory.Source)" }
            Copy-Item $directory.Source -Destination (Join-Path $package $directory.Destination) -Recurse -Force
          }

          # Bundle the SDL2 runtime required by native graphics programs.
          $sdlZip = Join-Path $env:RUNNER_TEMP 'SDL2-2.32.10-win32-x64.zip'
          $sdlExtract = Join-Path $env:RUNNER_TEMP 'SDL2-runtime'
          Invoke-WebRequest 'https://www.libsdl.org/release/SDL2-2.32.10-win32-x64.zip' -OutFile $sdlZip
          Expand-Archive -LiteralPath $sdlZip -DestinationPath $sdlExtract -Force
          $sdlDll = Get-ChildItem -LiteralPath $sdlExtract -Filter 'SDL2.dll' -File -Recurse | Select-Object -First 1
          if (-not $sdlDll) { throw 'SDL2.dll was not found in the official SDL2 runtime archive.' }
          Copy-Item -LiteralPath $sdlDll.FullName -Destination (Join-Path $package 'runtime/SDL2.dll') -Force
          $sdlLicense = Get-ChildItem -LiteralPath $sdlExtract -File -Recurse | Where-Object { $_.Name -match '^(LICENSE|COPYING)(\.txt)?$' } | Select-Object -First 1
          if ($sdlLicense) { Copy-Item -LiteralPath $sdlLicense.FullName -Destination (Join-Path $package 'SDL2-LICENSE.txt') -Force }

          # Bundle the optional SDL extensions plus their DLL dependencies.
          $runtimeDir = Join-Path $package 'runtime'
          $sdlAddons = @(
            @{ Name = 'SDL2_image'; Url = 'https://www.libsdl.org/projects/SDL_image/release/SDL2_image-2.8.3-win32-x64.zip'; Expected = 'SDL2_image.dll' },
            @{ Name = 'SDL2_ttf'; Url = 'https://www.libsdl.org/projects/SDL_ttf/release/SDL2_ttf-2.24.0-win32-x64.zip'; Expected = 'SDL2_ttf.dll' },
            @{ Name = 'SDL2_mixer'; Url = 'https://www.libsdl.org/projects/SDL_mixer/release/SDL2_mixer-2.8.2-win32-x64.zip'; Expected = 'SDL2_mixer.dll' }
          )
          foreach ($addon in $sdlAddons) {
            $archive = Join-Path $env:RUNNER_TEMP ($addon.Name + '-runtime.zip')
            $extract = Join-Path $env:RUNNER_TEMP ($addon.Name + '-runtime')
            Invoke-WebRequest $addon.Url -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
            $dlls = @(Get-ChildItem -LiteralPath $extract -Filter '*.dll' -File -Recurse)
            if (-not ($dlls | Where-Object { $_.Name -eq $addon.Expected })) {
              throw "$($addon.Name) runtime DLL $($addon.Expected) was not found in its official archive."
            }
            foreach ($dll in $dlls) {
              if ($dll.Name -ne 'SDL2.dll') {
                Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $runtimeDir $dll.Name) -Force
              }
            }
            $license = Get-ChildItem -LiteralPath $extract -File -Recurse | Where-Object { $_.Name -match '^(LICENSE|COPYING|COPYRIGHT)(\.txt)?$' } | Select-Object -First 1
            if ($license) {
              Copy-Item -LiteralPath $license.FullName -Destination (Join-Path $package ($addon.Name + '-LICENSE.txt')) -Force
            }
          }

          # sqlite3.dll is loaded dynamically by std.db; include it as well.
          $sqliteZip = Join-Path $env:RUNNER_TEMP 'sqlite-dll-win-x64-3540000.zip'
          $sqliteExtract = Join-Path $env:RUNNER_TEMP 'sqlite-runtime'
          Invoke-WebRequest 'https://www.sqlite.org/2026/sqlite-dll-win-x64-3540000.zip' -OutFile $sqliteZip
          Expand-Archive -LiteralPath $sqliteZip -DestinationPath $sqliteExtract -Force
          $sqliteDll = Get-ChildItem -LiteralPath $sqliteExtract -Filter 'sqlite3.dll' -File -Recurse | Select-Object -First 1
          if (-not $sqliteDll) { throw 'sqlite3.dll was not found in the official SQLite archive.' }
          Copy-Item -LiteralPath $sqliteDll.FullName -Destination (Join-Path $runtimeDir 'sqlite3.dll') -Force
          Set-Content -LiteralPath (Join-Path $package 'SQLITE-LICENSE.txt') -Value 'SQLite is in the public domain. See https://sqlite.org/copyright.html' -Encoding UTF8

          New-Item -ItemType Directory -Path (Join-Path $package 'examples') -Force | Out-Null
          Copy-Item 'examples/assets' -Destination (Join-Path $package 'examples') -Recurse -Force
          New-Item -ItemType Directory -Path (Join-Path $package 'MyPrograms') -Force | Out-Null
          Copy-Item 'examples/hello.nx' -Destination (Join-Path $package 'MyPrograms/hello.nx') -Force

          $rootFiles = @(
            'NEXUS-Windows.ps1',
            'Install-NEXUS.bat',
            'nexus.cmd',
            'Install-NEXUS-Path.ps1',
            'Uninstall-NEXUS-Path.ps1',
            'Run-NEXUS.bat',
            'Build-NEXUS.bat',
            'Check-NEXUS-Toolchain.bat',
            'Install-Requirements.bat',
            'Install-Windows-Association.ps1',
            'Uninstall-Windows-Association.ps1',
            'README-WINDOWS-RU.txt',
            'NEXUS-Console.bat',
            'README.md',
            'THIRD_PARTY_NOTICES.md',
            'LICENSE'
          )
          foreach ($file in $rootFiles) {
            if ($file -eq 'LICENSE') {
              $sourceFile = 'LICENSE'
            } else {
              $sourceFile = Join-Path '.github/project-tools/repository-files' $file
              if (-not (Test-Path $sourceFile)) { $sourceFile = $file }
            }
            if (-not (Test-Path $sourceFile)) { throw "Required package file missing: $sourceFile" }
            Copy-Item $sourceFile -Destination $package -Force
          }

          # Record the release version next to the executable and fail before
          # packaging if either the build output or copied payload is stale.
          Set-Content -LiteralPath (Join-Path $package 'VERSION.txt') -Value $env:NEXUS_VERSION -Encoding ASCII
          $expectedVersion = '^Nexus\s+' + [regex]::Escape($env:NEXUS_VERSION) + '\b'
          foreach ($compilerPath in @((Join-Path $env:GITHUB_WORKSPACE 'build/nexus.exe'), (Join-Path $package 'bin/nexus-core.exe'))) {
            $compilerOutput = @(& $compilerPath --version 2>&1)
            if ($LASTEXITCODE -ne 0 -or (($compilerOutput -join "`n") -notmatch $expectedVersion)) {
              throw "Compiler version mismatch in $compilerPath; expected $env:NEXUS_VERSION, got: $($compilerOutput -join "`n")"
            }
            Write-Host "Verified compiler payload $compilerPath: $($compilerOutput -join ' ')"
          }

          $zip = Join-Path $env:RUNNER_TEMP 'NEXUS_Windows_Portable.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created package: $zip"

      - name: Verify command-line launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'NEXUS_Windows_Portable'
          $sdlRuntime = Join-Path $package 'runtime/SDL2.dll'
          if (-not (Test-Path -LiteralPath $sdlRuntime)) { throw 'Portable package is missing runtime/SDL2.dll.' }
          foreach ($runtimeDll in @('SDL2_image.dll','SDL2_ttf.dll','SDL2_mixer.dll','sqlite3.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $package ('runtime/' + $runtimeDll)))) {
              throw "Portable package is missing bundled runtime dependency: $runtimeDll"
            }
          }
          $toolchainCompiler = Join-Path $package 'toolchain/zig.exe'
          $toolchainLibrary = Join-Path $package 'toolchain/lib'
          $compilerWrapper = Join-Path $package 'bin/clang++.cmd'
          $oneClickInstaller = Join-Path $package 'Install-NEXUS.bat'
          foreach ($required in @($toolchainCompiler,$toolchainLibrary,$compilerWrapper,$oneClickInstaller)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Portable package is missing embedded toolchain component: $required" }
          }

          # Run the actual one-click installer and verify that the selected
          # package root is FIRST in the current user's PATH. Restore the runner
          # profile afterward so this test leaves no environment changes behind.
          $oldUserPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          try {
            $env:NEXUS_INSTALLER_NO_PAUSE = '1'
            & $oneClickInstaller
            if ($LASTEXITCODE -ne 0) { throw "Install-NEXUS.bat failed with exit code $LASTEXITCODE." }
            $installedUserPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            $pathEntries = @($installedUserPath -split ';' | ForEach-Object { $_.Trim().Trim([char]34) })
            $firstUserPath = if ($pathEntries.Count -gt 0) { $pathEntries[0].TrimEnd([char]92,[char]47) } else { '' }
            $expectedUserPath = $package.TrimEnd([char]92,[char]47)
            if (-not [string]::Equals($firstUserPath, $expectedUserPath, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Install-NEXUS.bat did not put the package root first in user PATH. First entry: $firstUserPath"
            }
            Write-Host 'One-click installer check passed; package root is first in user PATH.'
          } finally {
            [Environment]::SetEnvironmentVariable('Path', $oldUserPath, 'User')
            Remove-Item Env:NEXUS_INSTALLER_NO_PAUSE -ErrorAction SilentlyContinue
          }

          # Strip LLVM/MSVC and other developer tools from PATH. The package
          # must still compile and launch a native application by itself.
          $nexus = Join-Path $package 'nexus.cmd'
          $oldPath = $env:PATH
          try {
            # Simulate PATH after Install-NEXUS-Path.ps1: only the package root
            # is added. nexus.cmd must expose bin/, toolchain/ and runtime/ itself.
            $env:PATH = (@(
              $package,
              $env:SystemRoot,
              (Join-Path $env:SystemRoot 'System32'),
              (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0')
            ) -join ';')
            $zigVersionOutput = & $toolchainCompiler version 2>&1
            if ($LASTEXITCODE -ne 0 -or (($zigVersionOutput -join "`n") -notmatch '^0\.14\.1')) {
              throw "Bundled Zig compiler check failed: $($zigVersionOutput -join "`n")"
            }
            $resolvedLauncher = Get-Command 'nexus.cmd' -ErrorAction Stop
            if ([System.IO.Path]::GetFullPath($resolvedLauncher.Source) -ne [System.IO.Path]::GetFullPath($nexus)) {
              throw "PATH resolved nexus.cmd to the wrong location: $($resolvedLauncher.Source)"
            }
            $version = & 'nexus.cmd' --version 2>&1
            if ($LASTEXITCODE -ne 0 -or (($version -join "`n") -notmatch ('Nexus ' + [regex]::Escape($env:NEXUS_VERSION)))) {
              throw "nexus --version failed: $($version -join "`n")"
            }

            # Exercise compiler discovery via the public launcher. The toolchain
            # and runtime folders are deliberately NOT directly in PATH.
            $doctor = & 'nexus.cmd' doctor 2>&1
            if ($LASTEXITCODE -ne 0 -or (($doctor -join "`n") -notmatch 'native backend:\s+OK')) {
              throw "nexus doctor could not find the bundled backend: $($doctor -join "`n")"
            }

            $smokeDir = Join-Path $env:RUNNER_TEMP 'nexus command smoke'
            New-Item -ItemType Directory -Path $smokeDir -Force | Out-Null
            $source = Join-Path $smokeDir 'hello world.nx'
            Set-Content -LiteralPath $source -Value 'fn main() { print("NEXUS_PATH_COMMAND_OK") }' -Encoding utf8
            $output = & 'nexus.cmd' $source 2>&1
            if ($LASTEXITCODE -ne 0 -or (($output -join "`n") -notmatch 'NEXUS_PATH_COMMAND_OK')) {
              throw "nexus <file.nx> failed: $($output -join "`n")"
            }
            Write-Host 'Self-contained NEXUS compiled and launched a .nx program with only its install root on PATH.'
            Write-Host 'Self-contained NEXUS passed with only its root directory added to PATH.'
          } finally {
            $env:PATH = $oldPath
          }

      - name: Build and smoke-test NEXUS Paint Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $env:RUNNER_TEMP 'NEXUS_Windows_Portable'
          $paintDir = Join-Path $env:RUNNER_TEMP 'NEXUS-Paint-Windows-x64'
          if (Test-Path -LiteralPath $paintDir) { Remove-Item -LiteralPath $paintDir -Recurse -Force }
          New-Item -ItemType Directory -Path $paintDir -Force | Out-Null

          $source = Join-Path $paintDir 'NEXUS-Paint.nx'
          Copy-Item 'examples/nexus_paint.nx' -Destination $source -Force
          $launcher = Join-Path $portable 'nexus.cmd'
          & $launcher 'build' $source
          if ($LASTEXITCODE -ne 0) { throw "NEXUS Paint compilation failed with exit code $LASTEXITCODE." }

          $exe = Join-Path $paintDir 'NEXUS-Paint.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'NEXUS Paint compiler reported success but produced no EXE.' }
          foreach ($dll in @('SDL2.dll','SDL2_image.dll','SDL2_ttf.dll','SDL2_mixer.dll','sqlite3.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $paintDir $dll))) {
              throw "NEXUS Paint package is missing runtime DLL: $dll"
            }
          }

          @'
          NEXUS Paint - Windows x64
          =========================
          This desktop raster drawing application is written in the NEXUS language.
          Launch NEXUS-Paint.exe. Keep the runtime DLLs in this same folder.
          The ZIP contains the executable, editable NEXUS source, runtime DLLs and this note.
          Source: https://github.com/fanxcz/nexus-lang/blob/main/examples/nexus_paint.nx
          '@ | Set-Content -LiteralPath (Join-Path $paintDir 'README-WINDOWS.txt') -Encoding UTF8

          # Smoke-test application startup; the app stays in its SDL event loop until closed.
          $paintProcess = Start-Process -FilePath $exe -WorkingDirectory $paintDir -PassThru
          Start-Sleep -Seconds 3
          $paintProcess.Refresh()
          if ($paintProcess.HasExited) {
            throw "NEXUS Paint exited during startup (exit code $($paintProcess.ExitCode))."
          }
          Stop-Process -Id $paintProcess.Id -Force
          Start-Sleep -Milliseconds 250

          $zipOut = Join-Path $env:RUNNER_TEMP 'NEXUS-Paint-Windows-x64.zip'
          if (Test-Path -LiteralPath $zipOut) { Remove-Item -LiteralPath $zipOut -Force }
          Compress-Archive -Path (Join-Path $paintDir '*') -DestinationPath $zipOut -CompressionLevel Optimal
          Write-Host "Built and smoke-tested NEXUS Paint app: $exe"
          Write-Host "Portable ZIP with runnable EXE, runtime DLLs and source: $zipOut"

      - name: Build graphical setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isccCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup 6 ISCC.exe was not found after installation.' }

          $package = Join-Path $env:RUNNER_TEMP 'NEXUS_Windows_Portable'
          $stagedPackage = Join-Path $env:GITHUB_WORKSPACE 'dist/NEXUS_Windows_Portable'
          New-Item -ItemType Directory -Path $stagedPackage -Force | Out-Null
          Copy-Item -Path (Join-Path $package '*') -Destination $stagedPackage -Recurse -Force

          $installer = Join-Path $env:RUNNER_TEMP $env:NEXUS_SETUP_ASSET
          & $iscc "/O$env:RUNNER_TEMP" "/DSourceDir=$stagedPackage" "/DMyAppVersion=$env:NEXUS_VERSION" '.github/project-tools/installer/NEXUS-Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path -LiteralPath $installer)) { throw 'The NEXUS Setup EXE was not produced.' }
          Write-Host "Created graphical installer: $installer"

          # Publish Paint as a real setup executable so its SDL/SQLite DLLs are installed beside the app.
          $paintDir = Join-Path $env:RUNNER_TEMP 'NEXUS-Paint-Windows-x64'
          $paintInstaller = Join-Path $env:RUNNER_TEMP 'NEXUS-Paint-Windows-x64.exe'
          & $iscc "/O$env:RUNNER_TEMP" "/DSourceDir=$paintDir" '.github/project-tools/installer/NEXUS-Paint-Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw "NEXUS Paint installer compilation failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path -LiteralPath $paintInstaller)) { throw 'The NEXUS Paint installer EXE was not produced.' }
          Write-Host "Created NEXUS Paint installer: $paintInstaller"

      - name: Verify setup installs and launches NEXUS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP $env:NEXUS_SETUP_ASSET
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\NEXUS'
          $oldUserPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $testFailed = $false
          try {
            $arguments = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/TASKS=addtopath,desktopicon,startmenuicon')
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "NEXUS Setup exited with code $($process.ExitCode)." }

            $nexus = Join-Path $installRoot 'nexus.cmd'
            $core = Join-Path $installRoot 'bin/nexus-core.exe'
            $zig = Join-Path $installRoot 'toolchain/zig.exe'
            foreach ($required in @($nexus,$core,$zig)) {
              if (-not (Test-Path -LiteralPath $required)) { throw "Installer did not install required file: $required" }
            }

            $version = & $nexus --version 2>&1
            $expected = 'Nexus ' + [regex]::Escape($env:NEXUS_VERSION)
            if ($LASTEXITCODE -ne 0 -or (($version -join "`n") -notmatch $expected)) {
              throw "Installed nexus --version failed: $($version -join "`n")"
            }
            $doctor = & $nexus doctor 2>&1
            if ($LASTEXITCODE -ne 0 -or (($doctor -join "`n") -notmatch 'native backend:\s+OK')) {
              throw "Installed nexus doctor failed: $($doctor -join "`n")"
            }
            $installedUserPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            $pathEntries = @($installedUserPath -split ';' | ForEach-Object { $_.Trim().Trim([char]34) })
            $firstUserPath = if ($pathEntries.Count -gt 0) { $pathEntries[0].TrimEnd([char]92,[char]47) } else { '' }
            if (-not [string]::Equals($firstUserPath, $installRoot.TrimEnd([char]92,[char]47), [StringComparison]::OrdinalIgnoreCase)) {
              throw "Setup was requested to add PATH but did not put the installation first. First entry: $firstUserPath"
            }

            $smokeDir = Join-Path $env:RUNNER_TEMP 'NEXUS installer smoke with spaces'
            New-Item -ItemType Directory -Path $smokeDir -Force | Out-Null
            $source = Join-Path $smokeDir 'hello world.nx'
            Set-Content -LiteralPath $source -Value 'fn main() { print("NEXUS_GUI_INSTALLER_SMOKE_OK") }' -Encoding utf8
            $output = & $nexus $source 2>&1
            if ($LASTEXITCODE -ne 0 -or (($output -join "`n") -notmatch 'NEXUS_GUI_INSTALLER_SMOKE_OK')) {
              throw "Installed NEXUS could not compile and run a source file: $($output -join "`n")"
            }

            $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'NEXUS Console.lnk'
            $startMenuShortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'NEXUS\NEXUS Console.lnk'
            foreach ($shortcut in @($desktopShortcut,$startMenuShortcut)) {
              if (-not (Test-Path -LiteralPath $shortcut)) { throw "Installer did not create selected shortcut: $shortcut" }
            }
            Write-Host 'GUI installer passed: shortcuts created; installed NEXUS built and ran a native program.'
          } finally {
            $uninstaller = Get-ChildItem -LiteralPath $installRoot -Filter 'unins*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($uninstaller) {
              $uninstallProcess = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
              if ($uninstallProcess.ExitCode -ne 0) { Write-Warning "Silent uninstall returned $($uninstallProcess.ExitCode)." }
            }
            [Environment]::SetEnvironmentVariable('Path', $oldUserPath, 'User')
            $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'NEXUS Console.lnk'
            $startMenuShortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'NEXUS'
            Remove-Item -LiteralPath $desktopShortcut -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $startMenuShortcut -Recurse -Force -ErrorAction SilentlyContinue
          }

          # Verify the Paint download installs a runnable app and all of its runtime DLLs.
          $paintInstaller = Join-Path $env:RUNNER_TEMP 'NEXUS-Paint-Windows-x64.exe'
          $paintInstallRoot = Join-Path $env:LOCALAPPDATA 'Programs\NEXUS Paint'
          try {
            $paintSetup = Start-Process -FilePath $paintInstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/TASKS=startmenuicon') -Wait -PassThru
            if ($paintSetup.ExitCode -ne 0) { throw "NEXUS Paint Setup exited with code $($paintSetup.ExitCode)." }
            $paintExe = Join-Path $paintInstallRoot 'NEXUS-Paint.exe'
            foreach ($required in @($paintExe, (Join-Path $paintInstallRoot 'SDL2.dll'), (Join-Path $paintInstallRoot 'SDL2_image.dll'), (Join-Path $paintInstallRoot 'SDL2_ttf.dll'), (Join-Path $paintInstallRoot 'SDL2_mixer.dll'), (Join-Path $paintInstallRoot 'sqlite3.dll'))) {
              if (-not (Test-Path -LiteralPath $required)) { throw "Paint Setup did not install required file: $required" }
            }
            $paintProcess = Start-Process -FilePath $paintExe -WorkingDirectory $paintInstallRoot -PassThru
            Start-Sleep -Seconds 3
            $paintProcess.Refresh()
            if ($paintProcess.HasExited) { throw "Installed NEXUS Paint exited during startup (exit code $($paintProcess.ExitCode))." }
            Stop-Process -Id $paintProcess.Id -Force
            $paintShortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'NEXUS Paint\NEXUS Paint.lnk'
            if (-not (Test-Path -LiteralPath $paintShortcut)) { throw 'Paint Setup did not create its Start menu shortcut.' }
            Write-Host 'NEXUS Paint installer passed: app, runtime DLLs, shortcut and startup verified.'
          } finally {
            $paintUninstaller = Get-ChildItem -LiteralPath $paintInstallRoot -Filter 'unins*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($paintUninstaller) {
              $paintUninstall = Start-Process -FilePath $paintUninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
              if ($paintUninstall.ExitCode -ne 0) { Write-Warning "Paint uninstall returned $($paintUninstall.ExitCode)." }
            }
            Remove-Item -LiteralPath (Join-Path ([Environment]::GetFolderPath('Programs')) 'NEXUS Paint') -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath (Join-Path ([Environment]::GetFolderPath('Desktop')) 'NEXUS Paint.lnk') -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows installer, portable compiler and NEXUS Paint
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS_Windows_Packages
          path: |
            ${{ runner.temp }}/NEXUS_Windows_Portable.zip
            ${{ runner.temp }}/NEXUS-Setup-*.exe
            ${{ runner.temp }}/NEXUS-Paint-Windows-x64.exe
            ${{ runner.temp }}/NEXUS-Paint-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build static HTML website
    needs: package-windows
    runs-on: ubuntu-latest
    # Publish docs as soon as the site is built. Windows packaging runs in
    # parallel so a slow native compiler/installer build cannot hold the homepage.
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read project versions
        shell: bash
        run: python scripts/nexus_version.py github-env >> "$GITHUB_ENV"

      - name: Download freshly built Windows packages
        uses: actions/download-artifact@v4
        with:
          name: NEXUS_Windows_Packages
          path: docs/assets/downloads

      - name: Package VS Code extension
        shell: bash
        run: |
          set -euo pipefail
          cd .github/project-tools/vscode-extension
          npm install --no-audit --no-fund
          npx --yes @vscode/vsce package --out "../../../docs/assets/downloads/$NEXUS_VSIX_ASSET"
          test -s "../../../docs/assets/downloads/$NEXUS_VSIX_ASSET"

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd docs/assets/downloads
          for asset in \
            NEXUS_Windows_Portable.zip \
            "$NEXUS_SETUP_ASSET" \
            "$NEXUS_VSIX_ASSET" \
            NEXUS-Paint-Windows-x64.exe \
            NEXUS-Paint-Windows-x64.zip; do
            sha256sum "$asset" > "$asset.sha256.txt"
          done
      
      - name: Validate every binary, archive and checksum before publishing
        run: python3 scripts/validate_downloads.py docs/assets/downloads

      - name: Validate links across README and documentation
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --include-fragments
            --timeout 30
            --max-retries 2
            --max-concurrency 8
            --exclude '^https://fanxcz.github.io/nexus-lang/'
            README.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            docs
            .github/project-tools/nexus-studio/README.md
            .github/project-tools/vscode-extension/README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2 libgdk-pixbuf-2.0-0

      - name: Install PDF rendering dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown pygments weasyprint

      - name: Build the manual PDF and copy the hand-authored HTML site
        run: |
          python3 scripts/build_manual_pdf.py docs/manual.md site/pdf/NEXUS-Documentation.pdf
          python3 scripts/build_website.py --source website --output site --downloads docs/assets/downloads --pdf site/pdf/NEXUS-Documentation.pdf
          test -s site/index.html
          test -s site/assets/site.css
          test -s site/assets/site.js
          echo "PASS hand-authored HTML, CSS and JavaScript assembled as static files."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    # Serialize only the actual Pages publication. Packaging and site building
    # remain free to run in parallel, so a slow Windows build cannot hold Pages.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pages-publish-pr-{0}', github.event.pull_request.number) || 'pages-publish' }}
      cancel-in-progress: true
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout source tree for complete route verification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Read project versions
        shell: bash
        run: python scripts/nexus_version.py github-env >> "$GITHUB_ENV"

      - name: Download freshly built Windows artifacts for deployment verification
        uses: actions/download-artifact@v4
        with:
          name: NEXUS_Windows_Packages
          path: expected-windows-artifacts

      - name: Verify every published documentation page and downloadable asset
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE_URL:-https://fanxcz.github.io/nexus-lang/}"
          base="${base%/}/"

          check_url() {
            local path="$1"
            local url="${base}${path}"
            local code="000"
            for attempt in 1 2 3 4 5 6; do
              code="$(curl --silent --show-error --location --head --output /dev/null --write-out '%{http_code}' "$url" 2>/dev/null || true)"
              if [[ "$code" =~ ^2[0-9][0-9]$ ]]; then
                echo "PASS $url ($code)"
                return 0
              fi
              echo "WAIT $url ($code), attempt $attempt/6"
              sleep 5
            done
            echo "FAIL $url remained unavailable (HTTP $code)" >&2
            return 1
          }

          # Verify every individually authored .html page in website/.
          while IFS= read -r file; do
            rel="${file#website/}"
            if [[ "$rel" == "index.html" ]]; then
              route=""
            else
              route="$rel"
            fi
            echo "Checking hand-authored HTML page: $route"
            check_url "$route"
          done < <(find website -type f -name '*.html' -print | sort)

          for asset in assets/site.css assets/site.js assets/mark.svg; do
            check_url "$asset"
          done

          assets=(
            "$NEXUS_SETUP_ASSET"
            "$NEXUS_SETUP_ASSET.sha256.txt"
            'NEXUS_Windows_Portable.zip'
            'NEXUS_Windows_Portable.zip.sha256.txt'
            "$NEXUS_VSIX_ASSET"
            "$NEXUS_VSIX_ASSET.sha256.txt"
            'NEXUS-Paint-Windows-x64.exe'
            'NEXUS-Paint-Windows-x64.exe.sha256.txt'
            'NEXUS-Paint-Windows-x64.zip'
            'NEXUS-Paint-Windows-x64.zip.sha256.txt'
          )
          for asset in "${assets[@]}"; do
            check_url "assets/downloads/$asset"
          done

          # Check bytes, not only HTTP status: a stale 3.0.0-named installer
          # must never pass deployment verification when CI built different bytes.
          compare_published_asset() {
            local filename="$1"
            local expected_file="$2"
            local remote_file
            local remote_checksum
            local expected_digest
            local actual_digest
            local published_digest
            local url="${base}assets/downloads/${filename}"
            expected_digest="$(sha256sum "$expected_file" | awk '{print $1}')"
            remote_file="$(mktemp)"
            remote_checksum="$(mktemp)"
            for attempt in 1 2 3 4 5 6; do
              if curl --silent --show-error --fail --location "$url" --output "$remote_file" &&
                 curl --silent --show-error --fail --location "${url}.sha256.txt" --output "$remote_checksum"; then
                actual_digest="$(sha256sum "$remote_file" | awk '{print $1}')"
                published_digest="$(awk 'NR == 1 {print $1}' "$remote_checksum")"
                if [[ "$actual_digest" == "$expected_digest" && "$published_digest" == "$expected_digest" ]]; then
                  echo "PASS published bytes and SHA-256: $filename ($actual_digest)"
                  rm -f "$remote_file" "$remote_checksum"
                  return 0
                fi
                echo "WAIT $filename is not yet the exact current build (attempt $attempt/6)"
              else
                echo "WAIT $filename is not downloadable yet (attempt $attempt/6)"
              fi
              sleep 5
            done
            echo "FAIL published $filename does not match this workflow's Windows build" >&2
            rm -f "$remote_file" "$remote_checksum"
            return 1
          }

          compare_published_asset "$NEXUS_SETUP_ASSET" "expected-windows-artifacts/$NEXUS_SETUP_ASSET"
          compare_published_asset 'NEXUS_Windows_Portable.zip' 'expected-windows-artifacts/NEXUS_Windows_Portable.zip'
          compare_published_asset 'NEXUS-Paint-Windows-x64.exe' 'expected-windows-artifacts/NEXUS-Paint-Windows-x64.exe'
          compare_published_asset 'NEXUS-Paint-Windows-x64.zip' 'expected-windows-artifacts/NEXUS-Paint-Windows-x64.zip'

          # The manual PDF is published at /pdf/, not in the download artifacts folder.
          check_url "pdf/NEXUS-Documentation.pdf"

          echo 'PASS: every published documentation route and packaged download URL responds successfully.'

